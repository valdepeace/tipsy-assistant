[package]
name = "tipsy-compadre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A tipsy, lazy, joking voice assistant for software developers"

[dependencies]
tipsy-protocol.workspace = true
tipsy-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ratatui = { version = "0.30" }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
earshot = "1.2"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
toml = "1.1"
dirs = "7"
keyring = "4.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
hound = "3.5"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
cpal = "0.18"
sysinfo = "0.39"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
sha2 = "0.10"
rust-embed = "8.13.0"
mime_guess = "2.0.5"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.27"
