[package]
name = "tipsy-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The browser client: Ratzilla backend, web-sys WebSocket, browser audio"

# `cdylib` is the artifact wasm-bindgen processes; `rlib` is what the host test binary links.
# Both are needed, and the workspace has no other crate-type (codebase-recon.md §1.1, §11.2).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tipsy-protocol.workspace = true
tipsy-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned as Task 3.1's verdict recorded them: `=0.3.1` because a bump to ratatui 0.31 while the
# workspace stays on 0.30 would silently produce two `Frame` types (ratzilla-and-wasm-audio.md:359).
# The other four are the versions `Cargo.lock` already held when this crate was added, which is why
# they introduce no new crate resolution (web-transport-and-terminal.md, ratzilla-and-wasm-audio.md).
ratzilla = "=0.3.1"
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"

[dependencies.web-sys]
version = "0.3.106"
features = [
  # The socket and the page's own location.
  "Window", "Location", "UrlSearchParams", "Document", "Element", "HtmlElement", "Node", "console",
  "WebSocket", "BinaryType", "MessageEvent",
  # Task 3.3: the microphone. Every name was checked against web-sys 0.3.106's own generated
  # bindings and its feature list, and the three the plan's list carries that are *not* here are
  # absent on purpose: **`AudioNode`** is where `connect_with_audio_node` lives — the plan omits it and
  # the source-to-node connection cannot be spelled without it; **`PermissionDescriptor` and
  # `PermissionName`** cannot be used at all, because `PermissionName` has no `Microphone` variant in
  # 0.3.106 and `Permissions::query` takes a `&js_sys::Object` (`gen_Permissions.rs`); and
  # **`CssStyleDeclaration`** is for styling the gate, which is Task 3.5's look and not this task's.
  "Navigator", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaTrackConstraints",
  "AudioContext", "AudioContextOptions", "BaseAudioContext", "AudioWorklet", "Worklet",
  "AudioWorkletNode", "AudioWorkletNodeOptions", "AudioNode", "MediaStreamAudioSourceNode",
  "MessagePort", "Permissions", "PermissionStatus", "PermissionState",
  # Task 3.3: the gate's own DOM. `disabled` lives on the button element, not on `HtmlElement`.
  "HtmlButtonElement",
]
