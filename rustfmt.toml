# The style this repository is written in, made explicit so that `cargo fmt` reproduces it and CI can
# hold everyone to it.
#
# `use_small_heuristics = "Max"` is the load-bearing half: with rustfmt's default heuristics a call
# like `assert_eq!(mic_route(open, login, live), want, "…")` is split over four lines even though it
# fits, and this tree keeps such a call on one line.
#
# `max_width = 120` is the width the tree was written at rather than rustfmt's default 100. Both were
# chosen by measuring the alternative: at 100 the tree differs from rustfmt in 925 places, at 110 in
# 418, at 120 in 363 — and with the default heuristics, 1501.
max_width = 120
use_small_heuristics = "Max"
