[workspace]
resolver = "3"
members = ["crates/tipsy-protocol", "crates/tipsy-ui", "crates/tipsy-assistant", "crates/tipsy-web", "xtask"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.96"
# The dual licence the Rust ecosystem settled on: permissive, and Apache-2.0 adds the explicit patent
# grant MIT leaves unsaid. `LICENSE-MIT` and `LICENSE-APACHE` carry both texts in full.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "all-widgets"] }
tipsy-protocol = { path = "crates/tipsy-protocol" }
tipsy-ui = { path = "crates/tipsy-ui" }
# `xtask shots` draws the HUD through the crates that own it, and the configuration screen needs the
# conversion the native client keeps (a `config.toml`'s real profiles, not a hand-kept copy of them).
tipsy-assistant = { path = "crates/tipsy-assistant" }
