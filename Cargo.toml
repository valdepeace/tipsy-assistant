[workspace]
resolver = "3"
members = ["crates/tipsy-protocol", "crates/tipsy-ui", "crates/tipsy-compadre", "crates/tipsy-web", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache", "all-widgets"] }
tipsy-protocol = { path = "crates/tipsy-protocol" }
tipsy-ui = { path = "crates/tipsy-ui" }
